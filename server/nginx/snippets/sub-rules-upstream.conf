# GitHub 反代的共享参数，由 snippets/sub-rules.conf 的 @sub_rules_* 命名 location include。
#
# 什么时候走到这里：发布目录 /var/lib/sub-rules 里没有对应文件。默认部署（不加
# --with-rules）没有发布目录，每个规则请求都走这里，下面的缓存设置直接决定
# push 后多久能拉到新版本。--with-rules 时只在同步从未成功、发布目录被误删、
# 或校验失败拒绝发布时触发：此时宁可拿一份可能略旧的 GitHub 副本，也不能让
# 端点 404，那会让 Mihomo 整个 rule-provider 加载失败，国内流量全部走代理。

# 用变量触发 nginx 每次按 resolver 重新解析，避免 GitHub 换 IP 后一直用启动时
# 解析到的旧地址。127.0.0.53 是 Ubuntu 24.04 的 systemd-resolved。
resolver 127.0.0.53 valid=300s ipv6=off;
resolver_timeout 5s;
set $sub_rules_upstream "raw.githubusercontent.com";

proxy_http_version 1.1;
proxy_set_header Host raw.githubusercontent.com;
proxy_set_header Connection "";
proxy_set_header Accept-Encoding "";
proxy_set_header User-Agent "sub-rules-proxy";
proxy_set_header Cookie "";
proxy_set_header Authorization "";

# 校验上游证书，不接受任何中间人
proxy_ssl_server_name on;
proxy_ssl_name raw.githubusercontent.com;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

proxy_connect_timeout 5s;
proxy_read_timeout 15s;
proxy_send_timeout 15s;

# ---- 缓存 ----
# 【必须】raw.githubusercontent.com 回 `Cache-Control: max-age=300`。nginx 默认
# 尊重上游指令，会**完全覆盖** proxy_cache_valid —— 2026-08-19 实测缓存文件头
# valid_sec - date = 300，而非配置里写的 60。必须显式忽略上游指令，本地 TTL 才生效。
proxy_ignore_headers Cache-Control Expires;

proxy_cache sub_rules;
proxy_cache_key "sub-rules:$uri";
proxy_cache_valid 200 30s;
proxy_cache_valid 404 30s;

# 带 ETag 的条件请求：内容没变时上游回 304，刷新代价极低。
proxy_cache_revalidate on;

# 并发回源时只放一个请求出去，其余等待，避免上游被打爆。
proxy_cache_lock on;

# 【必须】不要加 `updating`，也不要开 proxy_cache_background_update。
# 那个组合会让缓存过期后的**第一个**请求同步拿到陈旧副本、只在后台回源；
# 而客户端「更新规则集」正是单次一次性拉取，于是必定拿到上一版规则
# （2026-08-19 复现：单拉 STALE 旧内容，紧接第二拉 HIT 新内容）。
# 改成过期后首个请求同步回源，点一次就是最新。
# 下面保留的分支只在上游真的出问题时兜底，不影响新鲜度。
proxy_cache_use_stale error timeout
                      http_500 http_502 http_503 http_504 http_403 http_429;

# 不把上游的缓存/身份相关响应头透传给客户端
proxy_hide_header Set-Cookie;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header ETag;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Server;
proxy_hide_header Via;
proxy_hide_header X-GitHub-Request-Id;
proxy_hide_header X-Fastly-Request-ID;
proxy_hide_header X-Served-By;
proxy_hide_header X-Cache;
proxy_hide_header X-Cache-Hits;
proxy_hide_header X-Timer;
