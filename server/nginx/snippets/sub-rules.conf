# Maintained by hand. Included from the subscription server block emitted by
# sub-manager (render_nginx). 缓存区在 /etc/nginx/conf.d/sub-rules-cache.conf。
#
# ── 两种供给方式，同一份配置 ────────────────────────────────────────────
#
# 每个 location 先 try_files 发布目录 /var/lib/sub-rules/ 里的同名文件，找不到
# 才落到 @sub_rules_* 命名 location，反代 raw.githubusercontent.com（缓存参数见
# sub-rules-upstream.conf）。
#
# 1. 默认部署（deploy.sh 不加 --with-rules）：没有发布目录，每个请求都走反代，
#    X-Rule-Source: github。push 后最长约 5.5 分钟才能拉到新版本：GitHub 在
#    Fastly 后面，回 `cache-control: max-age=300`，各边缘节点独立计时（实测同一
#    URL 的 source-age 在不同 POP 相差近 300s）；查询串会被归一化、请求头
#    `Cache-Control: no-cache` 不被理会，服务器侧绕不过去。再加本机缓存 30 秒。
#
# 2. deploy.sh --with-rules：sub-rules-sync.timer 每分钟把 git 工作副本
#    /root/code/shadowrocket-config 发布到发布目录，nginx 直接 serve，
#    X-Rule-Source: local。无任何缓存层，push 到生效的延迟上限 = 同步周期
#    （1 分钟），客户端单次拉取一定拿到发布目录里的当前内容。此时反代只在
#    发布目录缺文件时触发，保证端点不 404：rule-provider 加载失败会让 Mihomo
#    的国内流量全部走代理。
#
# 两种方式下客户端都不直连 raw.githubusercontent（国内被墙），只连本站订阅端口；
# URL 恒定，订阅内容不变，不必重启 subconverter 或重新添加订阅。
#
# 路径前缀是随机值，仅用于避免被扫描器指纹识别；文件内容本身是 GitHub 上的
# 公开规则，不属于凭据。

location = /r/<RULES_PREFIX>/ChinaDirect.list {
    limit_except GET { deny all; }
    root /var/lib/sub-rules;
    try_files /ChinaDirect.list @sub_rules_chinadirect;

    include /etc/nginx/snippets/sub-rules-common.conf;
    add_header X-Rule-Source "local" always;
}

# 反代上游指向自维护的公开规则仓库，deploy.sh --rules-repo 会替换这里的仓库名。
# 换成你自己的 <GitHub 用户>/<规则仓库> 时，保留 main 分支和 rules/ 下的文件名，
# 与发布目录 /var/lib/sub-rules 里的文件名一一对应。
location @sub_rules_chinadirect {
    include /etc/nginx/snippets/sub-rules-upstream.conf;
    include /etc/nginx/snippets/sub-rules-common.conf;
    add_header X-Rule-Source "github" always;
    add_header X-Rule-Cache $upstream_cache_status always;

    proxy_pass https://$sub_rules_upstream/DuskWander87/shadowrocket-config/main/rules/ChinaDirect.list;
}

location = /r/<RULES_PREFIX>/Reject.list {
    limit_except GET { deny all; }
    root /var/lib/sub-rules;
    try_files /Reject.list @sub_rules_reject;

    include /etc/nginx/snippets/sub-rules-common.conf;
    add_header X-Rule-Source "local" always;
}

location @sub_rules_reject {
    include /etc/nginx/snippets/sub-rules-upstream.conf;
    include /etc/nginx/snippets/sub-rules-common.conf;
    add_header X-Rule-Source "github" always;
    add_header X-Rule-Cache $upstream_cache_status always;

    proxy_pass https://$sub_rules_upstream/DuskWander87/shadowrocket-config/main/rules/Reject.list;
}
