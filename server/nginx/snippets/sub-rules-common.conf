# 规则端点两条服务路径（发布目录里的本地文件 / GitHub 反代）共用的响应整形。
# 由 snippets/sub-rules.conf 的每个 location 和每个 @fallback 命名 location 各自 include。
#
# 注意 add_header 的继承规则：某一层只要定义了任何 add_header，就**不再**继承上层的。
# 所以这些头必须在两条路径上分别 include，不能只放在外层。

default_type text/plain;
charset utf-8;

add_header Cache-Control "no-cache" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
