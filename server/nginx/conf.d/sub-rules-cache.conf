# Generated by hand for the self-hosted rule-list reverse proxy.
# http 上下文，必须独立于 sub-manager 生成的 server 块。
#
# 该缓存不是为了减少回源，而是故障兜底：inactive=30d 让最后一份成功响应长期留存，
# 配合 snippets/sub-rules.conf 里的 proxy_cache_use_stale，在 GitHub 不可达时
# 仍能向客户端提供上一份可用规则，避免 Mihomo 加载 rule-providers 失败。

proxy_cache_path /var/cache/nginx/sub-rules
                 levels=1:2
                 keys_zone=sub_rules:1m
                 max_size=8m
                 inactive=30d
                 use_temp_path=off;
