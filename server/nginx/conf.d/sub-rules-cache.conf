# 规则端点 GitHub 反代的缓存区，由 deploy.sh 安装。
# http 上下文，必须独立于 sub-manager 生成的 server 块。
#
# 默认部署（不加 --with-rules）每个规则请求都经过这个缓存，TTL 30 秒，见
# snippets/sub-rules-upstream.conf；--with-rules 时只在发布目录缺文件时用到。
# 它的用途是故障兜底，不是减少回源：inactive=30d 让最后一份成功响应长期留存，
# 配合 sub-rules-upstream.conf 里的 proxy_cache_use_stale，在 GitHub 不可达时
# 仍能向客户端提供上一份可用规则，避免 Mihomo 加载 rule-providers 失败。

proxy_cache_path /var/cache/nginx/sub-rules
                 levels=1:2
                 keys_zone=sub_rules:1m
                 max_size=8m
                 inactive=30d
                 use_temp_path=off;
