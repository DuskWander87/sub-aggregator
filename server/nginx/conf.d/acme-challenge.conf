# ACME HTTP-01 挑战路径。deploy.sh 用 acme.sh --webroot /var/www/acme 签发和续期，
# Let's Encrypt 从公网 80 端口回读这里写入的 token。
#
# server_name 由部署脚本替换为订阅域名。精确匹配优先于发行版默认站点，所以这里
# 不用 default_server，也不会和 sites-enabled/default 冲突。
server {
    listen 80;
    listen [::]:80;
    server_name sub.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
